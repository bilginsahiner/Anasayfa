<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Programı - Müzik Çalar</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
            padding-bottom: 140px;
        }

        .dashboard-container {
            padding: 25px;
            max-width: 500px;
            margin: auto;
        }

        .welcome-section h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 5px; }
        .welcome-section p { color: #a0a0a0; margin-top: 0; }

        /* Müzik Çalar Tasarımı */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e1e26;
            border-top: 2px solid #6246ea;
            padding: 15px 0 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }

        .track-name {
            font-size: 24px;
            margin-bottom: 5px;
            color: #6246ea;
            font-weight: bold;
        }

        /* İlerleme Çubuğu Alanı */
        .progress-container {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: #2d2d3a;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            pointer-events: none; /* Tıklanabilirliği engeller */
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #6246ea;
            box-shadow: 0 0 8px rgba(98, 70, 234, 0.6);
            transition: width 0.5s linear;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .play-btn {
            background: #6246ea;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(98, 70, 234, 0.4);
        }

        #yt-player { display: none; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header class="welcome-section">
        <h1>Hoş Geldin! 🌙</h1>
        <p>Günün özetine göz atabilirsin.</p>
    </header>
</div>

<div class="music-player">
    <div class="track-name">ن</div>
    
    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="seekBack()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="control-btn play-btn" onclick="togglePlay()">
            <svg id="play-icon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="control-btn" onclick="seekForward()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>
</div>

<div id="yt-player"></div>

<script>
    var player;
    var isPlaying = false;
    var hasStarted = false;
    var progressInterval;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0',
            width: '0',
            videoId: 'ElqvHjrR4IQ',
            playerVars: {
                'start': 12,
                'controls': 0
            }
        });
    }

    function updateProgressBar() {
        if (player && player.getDuration) {
            var currentTime = player.getCurrentTime();
            var duration = player.getDuration();
            var percentage = (currentTime / duration) * 100;
            document.getElementById('progress').style.width = percentage + "%";
        }
    }

    function togglePlay() {
        if (!isPlaying) {
            if (!hasStarted) {
                player.seekTo(12);
                hasStarted = true;
            }
            player.playVideo();
            document.getElementById('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            isPlaying = true;
            // İlerlemeyi her saniye güncelle
            progressInterval = setInterval(updateProgressBar, 1000);
        } else {
            player.pauseVideo();
            document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            isPlaying = false;
            clearInterval(progressInterval);
        }
    }

    function seekBack() { player.seekTo(player.getCurrentTime() - 10); }
    function seekForward() { player.seekTo(player.getCurrentTime() + 10); }
</script>

</body>
</html>
