<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasayfa</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bilgin Şahiner">
    <link rel="icon" type="image/png" href="ikon.png">
    <link rel="apple-touch-icon" href="ikon.png">
    
    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
            padding-bottom: 100px; 
            transition: padding-bottom 0.5s ease; 
        }

        .dashboard-container {
            padding: 25px;
            max-width: 500px;
            margin: auto;
        }

        .welcome-section h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .moon-icon {
            width: 24px;
            height: 24px;
            color: #6246ea;
            transform: scaleX(-1) rotate(10deg);
            filter: drop-shadow(0 0 5px rgba(98, 70, 234, 0.4));
        }

        .welcome-section p { color: #a0a0a0; margin-top: 0; }

        .btn-container { 
            margin-top: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .schedule-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(98, 70, 234, 0.1);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            border: 1px solid rgba(98, 70, 234, 0.3);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: fit-content;
        }

        .schedule-btn:hover {
            background: rgba(98, 70, 234, 0.2);
            border-color: #6246ea;
            transform: translateY(-2px);
        }

        .schedule-btn svg { color: #a29bfe; }

        .info-bubble {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #6246ea;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #d0d0d0;
        }

        .info-bubble strong {
            color: #ffffff;
            display: block;
            margin-bottom: 5px;
        }

        .hadis-box {
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            background: rgba(98, 70, 234, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(98, 70, 234, 0.1);
        }

        .hadis-arapca {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 8px;
            display: block;
            direction: rtl;
        }

        .hadis-turkce {
            font-size: 0.85rem;
            color: #a0a0a0;
            font-style: italic;
        }

        /* --- Müzik Çalar Tasarımı (Güncellendi) --- */
        
        .music-trigger {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 40px;
            height: 40px;
            background: #6246ea;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(98, 70, 234, 0.6);
            z-index: 10000;
            transition: all 0.3s ease;
        }

        .music-trigger.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
        }

        .music-player {
            position: fixed;
            bottom: -300px;
            left: 0;
            width: 100%;
            /* Resim Tam Boyut + Boşluklarda Desen */
            background-color: #1e1e26;
            background-image: radial-gradient(rgba(98, 70, 234, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 2px solid #6246ea;
            padding: 10px 0 25px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px 20px 0 0;
        }

        /* Resim için özel katman: Tam boyutu bu sağlar */
        .player-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain; /* Resmi kesmeden sığdırır */
            opacity: 0.3; /* Yazıların okunması için hafif şeffaflık */
            z-index: -1;
            pointer-events: none;
        }

        .music-player.active { bottom: 0; }

        .close-player {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.4);
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .track-name {
            font-size: 24px;
            margin-bottom: 5px;
            color: #6246ea;
            text-shadow: 0 0 10px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,1);
            font-weight: bold;
        }

        .progress-container {
            width: 80%;
            max-width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            pointer-events: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #6246ea;
            box-shadow: 0 0 8px rgba(98, 70, 234, 0.8);
            transition: width 0.1s linear;
        }

        .controls { display: flex; align-items: center; gap: 30px; }
        .control-btn { background: none; border: none; color: white; cursor: pointer; display: flex; align-items: center; }

        .play-btn {
            background: #6246ea;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(98, 70, 234, 0.6);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header class="welcome-section">
        <h1>
            Hoş Geldin!
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </h1>
        <p>Günün özetine göz atabilirsin.</p>
        
        <div class="btn-container">
            <a href="https://bilginsahiner.github.io/Ders-Programi" class="schedule-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                <span>Giriş</span>
            </a>

            <a href="https://www.instagram.com/bilginsahiner01" class="schedule-btn" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>bilginsahiner01</span>
            </a>

            <a href="mailto:bilginsahiner@gmail.com" class="schedule-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>bilginsahiner@gmail.com</span>
            </a>
        </div>

        <div class="info-bubble" id="infoBox">
            <strong>Ders notlarına erişmek için:</strong>
            Giriş tuşuna bastıktan sonra sol üstteki menüye tıklayarak ders notlarına erişebilirsiniz.
        </div>

        <div class="hadis-box">
            <span class="hadis-arapca">سَيِّدُ الْقَوْمِ خَادِمُهُمْ</span>
            <span class="hadis-turkce">"Milletin efendisi, onlara hizmet edendir."</span>
        </div>
    </header>
</div>

<div class="music-trigger" id="musicTrigger" onclick="togglePlayerPanel()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
    </svg>
</div>

<div class="music-player" id="playerPanel">
    <div class="player-bg-image" id="playerBg"></div> <div class="close-player" onclick="togglePlayerPanel()"></div>
    <div class="track-name" id="display-track-name">ب</div>
    <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
    <div class="controls">
        <button class="control-btn" onclick="prevTrack()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play-btn" onclick="togglePlay()">
            <svg id="play-icon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" onclick="nextTrack()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>
</div>

<audio id="main-audio" src="ب.mp3"></audio>

<script>
    var audio = document.getElementById('main-audio');
    var isPlaying = false;
    var progressInterval;
    
    var tracks = [
        { name: "ب", src: "ب.mp3", bg: "ب.jpg", start: 11 },
        { name: "حبيبتي", src: "Çok Güzel (Nakarat).m4a", bg: "ن.jpg", start: 0 }
    ];
    var currentTrackIndex = 0;

    window.onload = function() {
        const playerState = localStorage.getItem('musicPlayerActive');
        if (playerState === 'true') {
            applyPanelState(true, false); 
        }
        loadTrack(0);
    };

    function loadTrack(index) {
        currentTrackIndex = index;
        var track = tracks[currentTrackIndex];
        audio.src = track.src;
        document.getElementById('display-track-name').innerText = track.name;
        
        // Yeni Tam Boyutlu Arkaplan Sistemi
        document.getElementById('playerBg').style.backgroundImage = `url('${track.bg}')`;
        
        audio.currentTime = track.start;
        if (isPlaying) {
            audio.play();
        }
    }

    function nextTrack() {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(currentTrackIndex);
    }

    function prevTrack() {
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        loadTrack(currentTrackIndex);
    }

    function togglePlayerPanel() {
        var panel = document.getElementById('playerPanel');
        var isCurrentlyActive = panel.classList.contains('active');
        applyPanelState(!isCurrentlyActive, true);
    }

    function applyPanelState(isActive, shouldScroll) {
        var panel = document.getElementById('playerPanel');
        var trigger = document.getElementById('musicTrigger');
        var body = document.body;

        if (isActive) {
            panel.classList.add('active');
            trigger.classList.add('hidden');
            body.style.paddingBottom = "280px"; 
            localStorage.setItem('musicPlayerActive', 'true');
            if (shouldScroll) {
                setTimeout(() => {
                    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
                }, 300);
            }
        } else {
            panel.classList.remove('active');
            trigger.classList.remove('hidden');
            body.style.paddingBottom = "100px";
            localStorage.setItem('musicPlayerActive', 'false');
        }
    }

    function updateProgressBar() { 
        if (audio.duration) { 
            var percentage = (audio.currentTime / audio.duration) * 100; 
            document.getElementById('progress').style.width = percentage + "%"; 
        } 
    }

    function togglePlay() { 
        if (audio.paused) { 
            audio.play(); 
            document.getElementById('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; 
            isPlaying = true; 
            progressInterval = setInterval(updateProgressBar, 500); 
        } else { 
            audio.pause(); 
            document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>'; 
            isPlaying = false; 
            clearInterval(progressInterval); 
        } 
    }

    audio.onended = function() { nextTrack(); };
</script>

</body>
</html>
