<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Programı - Müzik Çalar</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
            padding-bottom: 120px;
        }

        .dashboard-container {
            padding: 25px;
            max-width: 500px;
            margin: auto;
        }

        .welcome-section h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 5px; }
        .welcome-section p { color: #a0a0a0; margin-top: 0; }

        /* Müzik Çalar Tasarımı */
        .music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e1e26;
            border-top: 2px solid #6246ea;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .play-btn {
            background: #6246ea;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(98, 70, 234, 0.4);
        }

        .track-name {
            font-size: 14px;
            margin-bottom: 10px;
            color: #6246ea;
            font-weight: bold;
        }

        #yt-player { display: none; } /* Videoyu gizle */
    </style>
</head>
<body>

<div class="dashboard-container">
    <header class="welcome-section">
        <h1>Hoş Geldin! 🌙</h1>
        <p>Günün özetine göz atabilirsin.</p>
    </header>
    </div>

<div class="music-player">
    <div class="track-name">Ramy - Slide (Playing from 12s)</div>
    <div class="controls">
        <button class="control-btn" onclick="seekBack()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="control-btn play-btn" onclick="togglePlay()">
            <svg id="play-icon" width="30" height="30" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="control-btn" onclick="seekForward()">
            <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>
</div>

<div id="yt-player"></div>

<script>
    var player;
    var isPlaying = false;
    var hasStarted = false;

    // YouTube API Yükleme
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0',
            width: '0',
            videoId: 'ElqvHjrR4IQ',
            playerVars: {
                'start': 12,
                'controls': 0
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        console.log("Müzik çalar hazır.");
    }

    function togglePlay() {
        if (!isPlaying) {
            // İlk kez basıldığında 12. saniyeye git ve oynat
            if (!hasStarted) {
                player.seekTo(12);
                hasStarted = true;
            }
            player.playVideo();
            document.getElementById('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            isPlaying = true;
        } else {
            player.pauseVideo();
            document.getElementById('play-icon').innerHTML = '<path d="M8 5v14l11-7z"/>';
            isPlaying = false;
        }
    }

    function seekBack() { player.seekTo(player.getCurrentTime() - 10); }
    function seekForward() { player.seekTo(player.getCurrentTime() + 10); }
</script>

</body>
</html>
